testimonials:
  - quote: >-
      [Roman] never focused solely on writing code or solving isolated technical
      challenges. Instead, he consistently considered the complete solution,
      from understanding the business problem and technical architecture to
      implementation, deployment, and long-term maintainability. [...] He is
      someone you can trust to take responsibility for a problem, work
      independently, and deliver high-quality solutions without requiring
      close supervision.
    author: Radmilo Krstonijevic
    role: Global Head of AI & Tech, Inter IKEA Group

