  default: >-
    I start with the problem, not the code: I talk to the people affected, figure out where it hurts, and build the solution that fixes it. 
    With over 8 years of experience working with large enterprises in retail, automotive and insurance, I understand how they decide, build and ship, and where and how it tends to fail. 
    I deliver systems that run efficiently in production through monitoring, evaluation and cost optimization.

  machine_learning_engineer: >-
    Test

