# Subtitle under your name on the website.
headline: Agentic AI Engineer | Forward-deployed delivery for enterprise clients

# Resume variants pick one of these by key.
summaries:
  default: >-
    For me, engineering is understanding the underlying problems first. I talk to the people involved and affected, understand their issues and wishes, and only then start designing and implementing a solution.
    With over 8 years of experience working with large enterprises in retail, automotive and insurance,
    I understand how they decide, build and ship, and where and how it tends to fail.
    I deliver well-tested systems that other engineers can understand and work with, and that run efficiently in production through monitoring, evaluation and cost optimization.
    
  mle: >-
    I build, deploy and run machine learning systems in production, from end-to-end ML pipelines on AWS and Azure to agentic AI platforms.
    With over 8 years of experience at large enterprises in insurance, automotive and retail, I own the whole scope:
    architecture, data pipelines, containerized deployment, CI/CD, retraining, evaluation, monitoring and cost.
    I deliver well-tested systems that other engineers can understand and work with.

  ds: >-
    I build forecasting and predictive models that hold up in production.
    With over 8 years of experience at large enterprises in insurance, automotive and retail, I take models from first analysis
    and backtesting to monitored, automatically retrained systems: from time-series forecasting at ING and forecasting the
    probability and size of insurance damages under strict regulatory constraints, to end-to-end production pipelines on Azure,
    Databricks and AWS. I explain results and trade-offs to business stakeholders, write tested, reviewed code that other engineers
    can maintain, and share what I learn through coaching, talks and shared modeling standards.

# Every bullet tag must be listed here. The build fails on typos.
tags:
  fde: Hands-on building and shipping with/for a client
  mle: Pipelines, infrastructure, CI/CD, monitoring, retraining
  ds: Statistics, predictive modeling, forecasting

about_pages:
  - title: About Me
    image: professional_profile.jpeg
    summary: default   # reuses summaries.default instead of repeating it

testimonials:
  - quote: >-
      [Roman] never focused solely on writing code or solving isolated technical
      challenges. Instead, he consistently considered the complete solution,
      from understanding the business problem and technical architecture to
      implementation, deployment, and long-term maintainability. [...] He is
      someone you can trust to take responsibility for a problem, work
      independently, and deliver high-quality solutions without requiring
      close supervision.
    author: Radmilo Krstonijevic
    role: Global Head of AI & Tech, Inter IKEA Group

