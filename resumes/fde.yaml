# Forward-deployed / hands-on AI engineering roles.
output: Roman_Slaap_Resume_FDE.pdf
headline: Agentic AI Engineer | Forward-deployed delivery for enterprise clients
availability: [Available immediately, Open to travel]   # shown after the headline
summary: default
tags: [fde]     # bullet needs one of these; earlier tag = higher in the list
max_bullets_per_position: 10
exclude_positions: [ing]      # position ids from data/career.yaml
# Skills block and per-role "Tech:" lines only show these groups, and only skills the listed roles used.
skill_groups: [llm, evaluation, data_ml, engineering, cloud]
exclude_skills: []            # skill ids from data/career.yaml
max_tech_per_position: 8      # first N shown skills from each role's `used:` list
certifications: [Tech Lead Development Programme, Data Engineering Accelerated]   # names from career.yaml
position_notes:               # extra line under a position, keyed by position id
  ikea: Recommendation from Global Head of AI & Tech, Inter IKEA Group, available on request.
max_pages: 5
publish: true                 # also deploy the PDF on the website
